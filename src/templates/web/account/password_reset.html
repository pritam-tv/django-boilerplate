{% extends "web/base.html" %}
{% block title %}비밀번호 찾기{% endblock %}
{% block content %}
<div class="card">
    <h1>비밀번호 찾기</h1>
    <form method="post">
        {% csrf_token %}
        <div class="form-row">
            <label for="email">이메일</label>
            <input type="email" id="email" name="email" required>
        </div>
        <div class="actions">
            <button type="submit" class="btn">재설정 링크 받기</button>
            <a href="{% url 'web-account-login' %}">로그인</a>
        </div>
    </form>
</div>
{% endblock %}
