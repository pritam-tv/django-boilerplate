{% extends "web/base.html" %}
{% block title %}비밀번호 변경{% endblock %}
{% block content %}
<div class="card">
    <h1>비밀번호 변경</h1>
    <form method="post">
        {% csrf_token %}
        <input type="hidden" name="hashed_email" value="{{ hashed_email }}">
        <input type="hidden" name="token" value="{{ token }}">
        <div class="form-row">
            <label for="password">새 비밀번호</label>
            <input type="password" id="password" name="password" required>
        </div>
        <div class="form-row">
            <label for="password_confirm">새 비밀번호 확인</label>
            <input type="password" id="password_confirm" name="password_confirm" required>
        </div>
        <div class="actions">
            <button type="submit" class="btn">변경하기</button>
            <a href="{% url 'web-account-login' %}">로그인</a>
        </div>
    </form>
</div>
{% endblock %}
