{% extends "web/base.html" %}
{% block title %}{{ notice.title }}{% endblock %}
{% block content %}
<article class="card">
    <h1>{{ notice.title }}</h1>
    <p class="muted">{{ notice.published_at|date:"Y.m.d H:i" }}</p>
    <div style="white-space: pre-wrap; margin-top: 18px;">{{ notice.content }}</div>
    <div class="actions">
        <a href="{% url 'web-cms-notice-list' %}">목록으로</a>
    </div>
</article>
{% endblock %}
