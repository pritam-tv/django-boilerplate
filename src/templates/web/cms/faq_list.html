{% extends "web/base.html" %}
{% block title %}FAQ{% endblock %}
{% block content %}
<h1>FAQ</h1>
<form class="search" method="get">
    <select name="category">
        <option value="">전체 카테고리</option>
        {% for category in categories %}
            <option value="{{ category.uuid }}" {% if category.uuid|stringformat:"s" == category_uuid %}selected{% endif %}>{{ category.name }}</option>
        {% endfor %}
    </select>
    <button type="submit" class="btn secondary">필터</button>
</form>
{% for faq in faqs %}
    <article class="card">
        <p class="muted">{{ faq.category.name }}</p>
        <h2>{{ faq.title }}</h2>
        <div style="white-space: pre-wrap;">{{ faq.content }}</div>
    </article>
{% empty %}
    <div class="card"><p class="muted">등록된 FAQ가 없습니다.</p></div>
{% endfor %}
{% endblock %}
